apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rsim.fullname" . }}-data
  labels: {{- include "rsim.labels" . | nindent 4 }}
  annotations:
    # The store is the source of each twin: an uninstall keeps it.
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ .Values.persistence.accessMode }}]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
