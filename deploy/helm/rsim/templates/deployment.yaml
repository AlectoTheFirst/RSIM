{{- include "rsim.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rsim.fullname" . }}
  labels: {{- include "rsim.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: 1
  # One writer of the store on a ReadWriteOnce volume.
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "rsim.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels: {{- include "rsim.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-postgres
          image: {{ .Values.postgres.image }}
          command:
            - sh
            - -c
            - until pg_isready -q -h {{ include "rsim.postgresHost" . }} -p 5432 -U {{ .Values.postgres.username }} -d {{ .Values.postgres.database }}; do sleep 2; done
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
      containers:
        - name: api
          image: {{ include "rsim.image" (dict "repository" .Values.image.repository "tag" .Values.image.tag "digest" .Values.image.digest "appVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --listen
            - 0.0.0.0:8787
            - --store
            - /data/rsim
            {{- range (include "rsim.publicOrigins" . | fromJsonArray) }}
            - --public-origin
            - {{ . | quote }}
            {{- end }}
            {{- range .Values.api.trustedProxies }}
            - --trusted-proxy
            - {{ . | quote }}
            {{- end }}
          env: {{- include "rsim.databaseEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8787
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
        {{- if .Values.collector.enabled }}
        - name: collector
          image: {{ include "rsim.image" (dict "repository" .Values.collector.image.repository "tag" .Values.collector.image.tag "digest" .Values.collector.image.digest "appVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if .Values.collector.envSecret }}
            - --env
            - /run/rsim/collect.env
            {{- end }}
            - --data
            - /data/rsim
            - run
            - --repeat
            {{- if .Values.collector.strictPins }}
            - --strict-pins
            {{- end }}
          env: {{- include "rsim.databaseEnv" . | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {{- toYaml .Values.collector.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.collector.envSecret }}
            - name: collect-env
              mountPath: /run/rsim
              readOnly: true
            {{- end }}
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "rsim.fullname" . }}-data
        {{- if and .Values.collector.enabled .Values.collector.envSecret }}
        - name: collect-env
          secret:
            secretName: {{ .Values.collector.envSecret }}
            items:
              - key: collect.env
                path: collect.env
        {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
