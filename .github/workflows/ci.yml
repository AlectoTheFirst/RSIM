name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: rsim
          POSTGRES_PASSWORD: rsim-test
          POSTGRES_DB: rsim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsim -d rsim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RSIM_TEST_DATABASE_URL: postgres://rsim:rsim-test@localhost:5432/rsim_test
    steps:
      - uses: actions/checkout@v7
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install 1.99 --profile minimal --component clippy --component rustfmt
          rustup default 1.99
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked
      - name: Tests
        run: cargo test --workspace --locked
