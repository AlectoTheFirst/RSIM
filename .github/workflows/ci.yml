name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      # rsim-api embeds the built UI; a missing UI is a build error.
      RSIM_UI_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install the UI dependencies
        run: npm ci --prefix ui
      - name: UI API types match openapi.json
        run: npm --prefix ui run api:check
      - name: UI tests
        run: npm --prefix ui test
      - name: UI build
        run: npm --prefix ui run build
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install 1.99 --profile minimal --component clippy --component rustfmt
          rustup default 1.99
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked
      - name: Tests
        run: cargo test --workspace --locked
