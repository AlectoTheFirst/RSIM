name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: rsim
          POSTGRES_PASSWORD: rsim-test
          POSTGRES_DB: rsim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsim -d rsim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RSIM_TEST_DATABASE_URL: postgres://rsim:rsim-test@localhost:5432/rsim_test
      # rsim-api embeds the built UI; a missing UI is a build error.
      RSIM_UI_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install the UI dependencies
        run: npm ci --prefix ui
      - name: UI API types match openapi.json
        run: npm --prefix ui run api:check
      - name: UI tests
        run: npm --prefix ui test
      - name: UI build
        run: npm --prefix ui run build
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install 1.99 --profile minimal --component clippy --component rustfmt
          rustup default 1.99
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format check
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked
      - name: Tests
        run: cargo test --workspace --locked

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the images with no push
        run: |
          for target in rsim rsim-collect; do
            docker buildx build --target "$target" --platform linux/amd64 .
          done

  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint and render the chart with the Helm of the runner
        run: |
          helm version
          chart=deploy/helm/rsim
          for instance in rsim rsim-dev rsim-demo; do
            helm lint --strict "$chart" -f "$chart/ci/$instance-values.yaml"
            helm template "$instance" "$chart" -f "$chart/ci/$instance-values.yaml" > /dev/null
          done

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit@0.23.0
      - name: Advisories of the locked dependencies
        run: cargo audit
