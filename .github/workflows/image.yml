name: Image

# Pushes the images rsim and rsim-collect to the GitHub Container Registry,
# tagged with the commit, only for a run by hand or a version tag.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to the registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push the images
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "| Image | Reference | Digest |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for target in rsim rsim-collect; do
            ref="ghcr.io/$owner/$target:$GITHUB_SHA"
            docker buildx build -f Containerfile --target "$target" --platform linux/amd64 \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --push -t "$ref" .
            digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
            echo "| $target | \`$ref\` | \`$digest\` |" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Log out of the registry
        if: always()
        run: docker logout ghcr.io
