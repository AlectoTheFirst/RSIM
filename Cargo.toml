[workspace]
resolver = "3"
members = [
    "crates/rsim-core",
    "crates/rsim-dd",
    "crates/rsim-functions",
    "crates/rsim-engine",
    "crates/rsim-topologies",
    "crates/rsim-contract",
    "crates/rsim-cli",
    "crates/rsim-mcp",
    "crates/rsim-api",
    "crates/rsim-store",
    "crates/rsim-collect",
    "crates/rsim-ingest",
    "crates/rsim-textfsm",
    "crates/rsim-inventory",
    "crates/rsim-routing",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/AlectoTheFirst/RSIM"

[workspace.dependencies]
rsim-core = { path = "crates/rsim-core" }
rsim-dd = { path = "crates/rsim-dd" }
rsim-functions = { path = "crates/rsim-functions" }
rsim-engine = { path = "crates/rsim-engine" }
rsim-topologies = { path = "crates/rsim-topologies" }
rsim-contract = { path = "crates/rsim-contract" }
rsim-cli = { path = "crates/rsim-cli" }
rsim-mcp = { path = "crates/rsim-mcp" }
rsim-store = { path = "crates/rsim-store" }
rsim-collect = { path = "crates/rsim-collect" }
rsim-ingest = { path = "crates/rsim-ingest" }
rsim-textfsm = { path = "crates/rsim-textfsm" }
rsim-inventory = { path = "crates/rsim-inventory" }
rsim-routing = { path = "crates/rsim-routing" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.bench]
debug = true

[profile.test]
opt-level = 1

[profile.test.package."*"]
opt-level = 2
