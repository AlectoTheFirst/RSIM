[workspace]
resolver = "3"
members = ["crates/rsim-core", "crates/rsim-functions", "crates/rsim-engine"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/AlectoTheFirst/RSIM"

[workspace.dependencies]
rsim-core = { path = "crates/rsim-core" }
rsim-functions = { path = "crates/rsim-functions" }
rsim-engine = { path = "crates/rsim-engine" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.bench]
debug = true
