[package]
name = "rsim-cli"
description = "Path queries on the rsim network digital twin, with text and versioned JSON output."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arrow-array = "60.1.0"
arrow-ord = "60.1.0"
clap = { version = "4.6.7", features = ["derive"] }
rayon = "1.12.0"
rsim-contract.workspace = true
rsim-core.workspace = true
rsim-engine.workspace = true
rsim-functions.workspace = true
rsim-ingest.workspace = true
rsim-store.workspace = true
rsim-topologies = { workspace = true, optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
rsim-cli = { path = ".", features = ["test-fixtures"] }
rsim-topologies.workspace = true
boon = "=0.6.1"
getrandom = "0.4.3"
rsim-contract.workspace = true
rsim-store.workspace = true

[features]
# The hand-built topologies of rsim-topologies as twins, for the tests and
# the benchmarks only. No binary of the product has them.
test-fixtures = ["dep:rsim-topologies"]

[lints]
workspace = true

[[bin]]
name = "rsim"
path = "src/main.rs"

[[bench]]
name = "scale"
harness = false
