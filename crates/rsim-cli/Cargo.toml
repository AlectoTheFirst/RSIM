[package]
name = "rsim-cli"
description = "Path queries on the rsim network digital twin, with text and versioned JSON output."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rsim-contract.workspace = true
rsim-core.workspace = true
rsim-engine.workspace = true
rsim-ingest.workspace = true
rsim-store.workspace = true
rsim-topologies.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
boon = "=0.6.1"
rsim-contract.workspace = true
rsim-store.workspace = true

[lints]
workspace = true

[[bin]]
name = "rsim"
path = "src/main.rs"
