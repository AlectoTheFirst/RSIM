[package]
name = "rsim-inventory"
description = "The inventory of rsim in PostgreSQL: the schema, the types, the reader and the writer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argon2 = "0.6.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "=1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros", "net", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14.0", features = ["ring"] }

[lints]
workspace = true
