[package]
name = "rsim-api"
description = "The REST API of the rsim network digital twin, with an OpenAPI 3.1 contract."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rsim-cli.workspace = true
rsim-contract.workspace = true
rsim-ingest.workspace = true
rsim-inventory.workspace = true
rsim-mcp.workspace = true
schemars = "=1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "signal"] }

[dev-dependencies]
rsim-cli = { workspace = true, features = ["test-fixtures"] }
boon = "=0.6.1"
getrandom = "0.4.3"
rsim-store.workspace = true

[lints]
workspace = true
