[package]
name = "rsim-collect"
description = "The device collectors of rsim. They write the snapshot store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["vyos", "unifi", "nxos", "iosxr", "iosxe", "velocloud", "equinix"]
vyos = ["ssh"]
nxos = ["ssh"]
iosxr = ["ssh"]
iosxe = ["ssh"]
unifi = ["https"]
velocloud = ["https", "dep:blake3"]
equinix = ["https"]
ssh = ["dep:russh"]
https = ["ssh", "dep:ring", "dep:rustls", "dep:tokio-rustls", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:bytes", "dep:httpdate", "dep:webpki-roots"]

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
blake3 = { version = "1.8.7", features = ["pure"], optional = true }
bytes = { version = "1.12.1", optional = true }
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4.3"
http-body-util = { version = "0.1.5", optional = true }
httpdate = { version = "1.0.3", optional = true }
hyper = { version = "1.12.0", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1.21", features = ["tokio"], optional = true }
ring = { version = "0.17.14", optional = true }
rsim-inventory.workspace = true
rsim-store.workspace = true
russh = { version = "=0.65.2", default-features = false, features = ["ring", "rsa"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"], optional = true }
webpki-roots = { version = "=1.0.12", optional = true }

[dev-dependencies]
arrow-array = "60.1.0"
criterion = "0.8"
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
rand = "0.10"
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
rsim-core.workspace = true
rsim-engine.workspace = true
rsim-ingest.workspace = true
tempfile = "3"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "test-util"] }

[[bin]]
name = "rsim-collect"
required-features = ["vyos", "unifi", "nxos", "iosxr", "iosxe", "velocloud"]

[[bench]]
name = "cycle"
harness = false

[lints]
workspace = true

[[example]]
name = "demo_enterprise"
required-features = ["nxos", "iosxe", "iosxr"]
