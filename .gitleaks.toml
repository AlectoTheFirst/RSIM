# Gitleaks config for the `secrets` job of ci.yml and for a local `gitleaks git`.
# It extends the default rule set. Each allowlist entry is a reviewed false positive.
# ci.yml pins the gitleaks version (GITLEAKS_VERSION).

[extend]
useDefault = true

[[allowlists]]
description = "the name of the cipher in the doc comment of the sealed secrets"
condition = "AND"
paths = ['''^crates/rsim-inventory/src/secret\.rs$''']
regexTarget = "line"
regexes = ['''//! secrets: ChaCha20-Poly1305 with a random nonce''']
